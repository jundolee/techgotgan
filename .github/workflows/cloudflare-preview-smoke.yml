name: Cloudflare preview smoke

on:
  push:
    branches:
      - jundolee/cloudflare-next-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - run: npm run build:cloudflare
      - name: Smoke test Cloudflare preview
        run: npm run smoke:cloudflare
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RSS_PROXY_TOKEN: ${{ secrets.RSS_PROXY_TOKEN }}
          RSS_PROXY_URL: ${{ vars.RSS_PROXY_URL }}
